<!doctype html>
<html lang="en-GB" data-theme="basalt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BASALT — Athletic House, Kings Cross</title>
    <meta
      name="description"
      content="BASALT is a members' training house in a converted 1871 ironworks in Kings Cross. Strength, conditioning and recovery across four floors — with coaches who write your plan by hand."
    />
    <meta name="theme-color" content="#12110f" />
    <meta property="og:title" content="BASALT — Athletic House" />
    <meta property="og:description" content="Pressure, heat & time. A members' training house in Kings Cross, London." />
    <meta property="og:image" content="/img/hero-deadlift-1400.webp" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved brand theme before first paint to avoid a flash of the default palette.
      try {
        var t = localStorage.getItem("basalt.theme");
        if (/^(basalt|atelier|grove|pulse|velvet)$/.test(t)) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BASALT needs JavaScript enabled to show the timetable and membership tools.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
